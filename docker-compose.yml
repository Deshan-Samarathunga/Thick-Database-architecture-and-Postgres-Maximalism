version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  postgrest:
    image: postgrest/postgrest
    environment:
      PGRST_DB_URI: postgres://myuser:mypassword@db:5432/taskdb
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_RAW_MEDIA_TYPES: "text/html,text/plain"
    ports:
      - "3000:3000"
    depends_on:
      - db
